# Dessine le serpent qui mange le calendrier des contributions, chaque nuit ou à la demande.
# Les images sont publiées sur la branche « output » et affichées dans le README.
name: Serpent des contributions

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

jobs:
  serpent:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: EnzoBuchaillat
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark&color_snake=#2F81F7
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
